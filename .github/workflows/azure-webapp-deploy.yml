name: Deploy to Azure Web App

# This workflow deploys the application to Azure Web App Service (App Service for Containers)
# It builds a Docker image containing both backend and frontend, pushes it to GitHub Container Registry,
# and deploys it to Azure Web App for Containers.
#
# Required GitHub Secrets:
# - AZURE_CREDENTIALS: Azure service principal JSON
# - AZURE_WEBAPP_NAME: artigenapp

on:
  push:
    branches:
      - Version-0.1
  workflow_dispatch:  # Allow manual triggering

env:
  # GitHub Container Registry
  REGISTRY: ghcr.io
  # Image name (will be: ghcr.io/OWNER/IMAGE_NAME)
  IMAGE_NAME: ${{ github.repository }}/aigov-app
  # Azure Web App name
  AZURE_WEBAPP_NAME: artigenapp

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # Required for pushing to GitHub Container Registry

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm run test -- --run
        continue-on-error: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (for tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .  # Build from repository root
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
        # AZURE_CREDENTIALS secret should contain:
        # {
        #   "clientId": "<service-principal-client-id>",
        #   "clientSecret": "<service-principal-secret>",
        #   "subscriptionId": "<azure-subscription-id>",
        #   "tenantId": "<azure-tenant-id>"
        # }
        # To create a service principal:
        # az ad sp create-for-rbac --name "aigov-github-actions" --role contributor --scopes /subscriptions/<subscription-id>/resourceGroups/<resource-group> --sdk-auth

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          # Azure Web App name: artigenapp
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          # Use latest tag for Azure deployment

